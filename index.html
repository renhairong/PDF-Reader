<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>云轩 PDF 阅读器 · 网页版</title>
<link rel="icon" type="image/png" href="./logo.png">
<link rel="apple-touch-icon" href="./logo.png">
<link rel="stylesheet" href="./node_modules/pdfjs-dist/web/pdf_viewer.css">
<style>
  :root{
    --bg:#f5f5f7; --bar:#ffffff; --line:#e8e8ed; --ink:#1d1d1f;
    --sub:#86868b; --brand:#1f883d; --brand2:#196e2e;
    --radius:10px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;font-family:-apple-system,"SF Pro Text","PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;}
  #app{display:flex;flex-direction:column;height:100vh;}
  /* toolbar */
  #toolbar{
    display:flex;align-items:center;justify-content:center;gap:4px;
    padding:10px 20px;
    background:rgba(255,255,255,.48);
    border-bottom:1px solid rgba(232,232,237,.3);
    box-shadow:0 1px 4px rgba(0,0,0,.04);
    backdrop-filter:saturate(150%) blur(24px);
    -webkit-backdrop-filter:saturate(150%) blur(24px);
    position:relative;z-index:10;
    flex-wrap:wrap;
  }
  #appTitle{
    position:absolute;left:20px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:6px;
    font-weight:600;font-size:14px;letter-spacing:.3px;
    color:var(--sub);user-select:none;pointer-events:none;
  }
  #toolbar .grp{
    display:flex;align-items:center;gap:6px;
    padding:0 14px;border-right:1px solid var(--line);
  }
  #toolbar .grp:last-child{border-right:none;padding-right:0}
  #toolbar .grp:first-child{padding-left:0}
  .btn{
    border:1px solid var(--line);background:#fff;
    border-radius:var(--radius);padding:0 14px;
    font-size:13px;cursor:pointer;color:var(--ink);
    transition:all .15s ease;
    user-select:none;white-space:nowrap;
    height:32px;display:inline-flex;align-items:center;justify-content:center;
  }
  .btn:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 1px 3px rgba(31,136,61,.08)}
  .btn:active{transform:scale(.96)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
  .title{font-weight:600;font-size:13px;letter-spacing:.3px;color:var(--sub);margin-right:4px;}
  .seg{
    display:inline-flex;border:1px solid var(--line);
    border-radius:var(--radius);overflow:hidden;background:#fff;
  }
  .seg button{
    border:none;background:transparent;padding:0 14px;
    font-size:13px;cursor:pointer;color:var(--sub);
    transition:color .15s;user-select:none;
    white-space:nowrap;
    height:32px;display:inline-flex;align-items:center;justify-content:center;
  }
  .seg button:not(:last-child){border-right:1px solid var(--line)}
  .seg button.active{color:var(--brand);font-weight:500}
  .zoomval{font-size:13px;color:var(--sub);min-width:44px;text-align:center;font-variant-numeric:tabular-nums;}
  #pageInfo{font-size:13px;color:var(--sub);min-width:90px;font-variant-numeric:tabular-nums;}
  #jumpInput{
    width:50px;font-size:13px;padding:6px 8px;
    border:1px solid var(--line);border-radius:var(--radius);
    text-align:center;outline:none;transition:border-color .15s;
    font-variant-numeric:tabular-nums;
  }
  #jumpInput:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(31,136,61,.12)}
  /* viewer */
  #viewerContainer{flex:1;overflow:auto;background:var(--bg);position:absolute;top:52px;left:0;right:0;bottom:0;}
  .pdfViewer{margin:0 auto;padding:24px;}
  .pdfViewer .page{box-shadow:0 2px 8px rgba(0,0,0,.06),0 1px 3px rgba(0,0,0,.04);}
  .dark .pdfViewer .page{box-shadow:0 2px 10px rgba(0,0,0,.18),0 1px 4px rgba(0,0,0,.12);}
  .pdfViewer.removePageBorders .page{background:transparent !important}
  /* empty state */
  #empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--sub);gap:12px;pointer-events:none;}
  #empty .big{font-size:16px;color:var(--ink);font-weight:500;}
  #empty .hint{font-size:13px;color:var(--sub);}
  #emptyOpen{
    color:var(--brand);cursor:pointer;
    border-bottom:1px dashed var(--brand);
    pointer-events:auto;
    transition:color .15s, border-color .15s;
  }
  #emptyOpen:hover{color:var(--brand2);border-bottom-color:var(--brand2);}
  /* ── 最近打开 ── */
  #recentFiles{margin-top:28px;width:100%;max-width:460px;text-align:left;}
  #recentFiles .rf-title{font-size:12px;color:var(--sub);margin-bottom:8px;padding:0 4px;user-select:none;letter-spacing:.3px;}
  .rf-item{
    display:flex;align-items:center;justify-content:space-between;
    padding:7px 12px;margin-bottom:2px;border-radius:6px;
    cursor:pointer;transition:background .12s;user-select:none;
    font-size:13px;color:var(--ink);pointer-events:auto;
  }
  .rf-item:hover{background:#e8e8ed;}
  .rf-item .rf-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0;}
  .rf-item .rf-time{font-size:11px;color:var(--sub);flex-shrink:0;margin-left:10px;font-variant-numeric:tabular-nums;}
  .rf-item:first-child .rf-name{font-weight:500;}
  /* 悬浮删除按钮 */
  .rf-item .rf-del{
    display:none;flex-shrink:0;margin-left:8px;
    width:20px;height:20px;border-radius:50%;border:none;
    background:transparent;color:#b0b0b5;cursor:pointer;
    font-size:12px;line-height:20px;text-align:center;
    padding:0;transition:background .12s,color .12s;
  }
  .rf-item:hover .rf-del{display:block}
  .rf-item .rf-del:hover{background:#e5e5ea;color:#c0392b}
  /* 全部清空按钮 */
  .rf-clear{
    display:block;margin-top:10px;padding:5px 12px;
    border:none;background:transparent;
    font-size:12px;color:var(--sub);cursor:pointer;
    border-radius:6px;transition:background .12s,color .12s;
    pointer-events:auto;
  }
  .rf-clear:hover{background:#e8e8ed;color:#c0392b}
  .rf-empty{font-size:12px;color:var(--sub);text-align:center;padding:4px 0;user-select:none;}
  .dark .rf-item:hover{background:#3a3a40;}
  .dark .rf-item .rf-del:hover{background:#4a4a50;color:#e55a5a}
  .dark .rf-clear:hover{background:#3a3a40;color:#e55a5a}
  /* ── 页脚 ── */
  #appFooter{
    position:fixed;left:0;right:0;bottom:0;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:8px 18px 12px;
    font-size:11px;color:var(--sub);
    pointer-events:none;z-index:5;
    user-select:none;
  }
  #appFooter a{color:var(--sub);text-decoration:none;pointer-events:auto}
  #appFooter a:hover{color:var(--brand);text-decoration:underline}
  .dark #appFooter a:hover{color:var(--brand)}
  /* drop overlay */
  #dropOverlay{
    position:fixed;inset:0;
    background:rgba(31,136,61,.08);
    border:2.5px dashed var(--brand);
    display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;
    font-size:18px;font-weight:600;color:var(--brand);z-index:80;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  #dropOverlay .sub{font-size:13px;font-weight:400;color:var(--sub);}
  #dropOverlay.show{display:flex;}
  /* loading */
  #loading{position:fixed;inset:0;background:rgba(255,255,255,.78);display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;z-index:60;}
  #loading.show{display:flex;}
  .spinner{width:32px;height:32px;border:2.5px solid #e5e5ea;border-top-color:var(--brand);border-radius:50%;animation:spin .7s linear infinite;}
  .spinner-text{font-size:14px;color:var(--sub);}
  @keyframes spin{to{transform:rotate(360deg)}}
  /* error */
  #error{
    position:fixed;left:50%;top:64px;transform:translateX(-50%);
    background:#f0faf2;color:#166534;
    border:1px solid #bbf7d0;
    padding:10px 20px;border-radius:var(--radius);
    font-size:13px;display:none;z-index:70;max-width:80%;
    box-shadow:0 4px 12px rgba(0,0,0,.1);
    text-align:center;
  }
  #error.show{display:block;}
  /* ── TOC 侧栏 ── */
  #tocBtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  #tocPanel{
    position:fixed;top:52px;left:0;bottom:0;width:280px;
    background:var(--bar);border-right:1px solid var(--line);
    z-index:20;display:none;overflow-y:auto;
    box-shadow:2px 0 10px rgba(0,0,0,.06);
    padding:8px 0;
  }
  #tocPanel.show{display:block}
  .toc-item{
    padding:7px 16px;cursor:pointer;font-size:13px;color:var(--ink);
    transition:background .12s;line-height:1.5;
    display:flex;justify-content:space-between;align-items:center;
    border-left:3px solid transparent;
    user-select:none;
  }
  .toc-item:hover{background:#f0f0f5;border-left-color:var(--brand);}
  .toc-item .toc-page{font-size:11px;color:var(--sub);font-variant-numeric:tabular-nums;flex-shrink:0;margin-left:8px;}
  .toc-empty{padding:32px 24px;text-align:center;color:var(--sub);font-size:13px;line-height:1.6;}
  .toc-hdr{display:none}
  /* 侧栏打开时 viewer 左移 */
  .show-sidebar #viewerContainer{left:280px}
  /* ── 进度记忆横幅 ── */
  #progBanner{
    position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
    background:var(--bar);border:1px solid var(--line);
    border-radius:var(--radius);padding:10px 20px;
    font-size:13px;color:var(--ink);
    box-shadow:0 4px 16px rgba(0,0,0,.1);
    display:none;z-index:25;align-items:center;gap:10px;
    cursor:pointer;transition:all .2s;
    white-space:nowrap;
  }
  #progBanner.show{display:flex}
  #progBanner:hover{box-shadow:0 6px 20px rgba(0,0,0,.14)}
  #progBanner .pg-icon{color:var(--brand);font-weight:600}
  #progBanner .pg-jump{color:var(--brand);text-decoration:underline;font-weight:500}
  #progBanner .pg-dismiss{color:var(--sub);margin-left:2px;font-size:16px;line-height:1;cursor:pointer;opacity:.5}
  #progBanner .pg-dismiss:hover{opacity:1}
  /* ── 全屏阅读 ── */
  #fsBtn{display:flex;align-items:center}
  #fsBtn svg{width:16px;height:16px}
  /* 悬停触发条：全屏时顶部的透明热区 */
  #fsStrip{display:none;position:fixed;top:0;left:0;right:0;height:40px;z-index:9}
  .fullscreen #fsStrip{display:block}
  .fullscreen #toolbar{
    transform:translateY(-100%);opacity:0;pointer-events:none;
    transition:transform .28s cubic-bezier(.25,0,.3,1),opacity .28s;
  }
  .fullscreen #viewerContainer{top:0!important}
  /* strip hover + toolbar self-hover 都显示 */
  .fullscreen #fsStrip:hover ~ #toolbar,
  .fullscreen #toolbar:hover{
    transform:translateY(0);opacity:1;pointer-events:auto;
  }
  #fsBtn svg.compress{display:none}
  .fullscreen #fsBtn svg.expand{display:none}
  .fullscreen #fsBtn svg.compress{display:block}
  /* ── 暗色模式 ── */
  #dmBtn svg.sun{display:none}
  .dark #dmBtn svg.moon{display:none}
  .dark #dmBtn svg.sun{display:block}
  .dark{
    --bg:#1c1c1e; --bar:#2c2c30; --line:#3a3a40; --ink:#e5e5e7;
    --sub:#8e8e93;
  }
  .dark #toolbar{background:rgba(44,44,48,.72)}
  .dark .btn{background:#2c2c30;border-color:var(--line);color:var(--ink)}
  .dark .btn:hover{border-color:var(--brand);color:var(--brand)}
  .dark .seg{background:#2c2c30;border-color:var(--line)}
  .dark .seg button{color:var(--sub)}
  .dark .seg button.active{color:var(--ink);font-weight:500}
  .dark .seg button:not(:last-child){border-color:var(--line)}
  .dark #jumpInput{background:#2c2c30;border-color:var(--line);color:var(--ink)}
  .dark #empty .big{color:var(--ink)}
  .dark #loading{background:rgba(0,0,0,.72)}
  .dark .spinner{border-color:#3a3a40;border-top-color:var(--brand)}
  .dark #error{background:#1e2a1e;color:#6fcf6f;border-color:#2d4a2d}
  .dark #tocPanel{background:var(--bar);border-color:var(--line)}
  .dark .toc-item{color:var(--ink)}
  .dark .toc-item:hover{background:#3a3a40}
  .dark .toc-empty{color:var(--sub)}
  .dark #progBanner{background:var(--bar);border-color:var(--line);color:var(--ink)}
  .dark #dropOverlay{background:rgba(31,136,61,.15)}
  .dark .page-nav{background:var(--bar);border-color:var(--line);color:var(--ink)}
  .dark .page-nav:hover{background:var(--brand);color:#fff;border-color:var(--brand)}
  /* pdf 页面底色只压暗、不反相（保留图片原色） */
  .dark .pdfViewer .page{background:#2c2c30 !important}
  .dark .pdfViewer .page canvas{filter:brightness(.55) saturate(.9)}
  .dark .pdfViewer .textLayer{filter:none !important;color:#d4d4d4}
  /* ── 搜索框 ── */
  #searchBtn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .search-bar{
    display:none;align-items:center;gap:6px;
    padding:6px 14px;
  }
  .search-bar.show{display:flex}
  #searchInput{
    width:160px;font-size:13px;padding:5px 8px;
    border:1px solid var(--line);border-radius:6px;
    outline:none;background:#fff;color:var(--ink);
    transition:border-color .15s;
  }
  #searchInput:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(31,136,61,.12)}
  #searchCount{font-size:12px;color:var(--sub);min-width:40px;text-align:center;font-variant-numeric:tabular-nums;}
  .search-nav{background:none;border:1px solid var(--line);border-radius:6px;padding:0 8px;height:26px;cursor:pointer;color:var(--sub);font-size:14px;display:flex;align-items:center;transition:.15s;}
  .search-nav:hover{border-color:var(--brand);color:var(--brand)}
  .search-nav:disabled{opacity:.3;cursor:default}
  .search-close{background:none;border:none;padding:0 4px;cursor:pointer;color:var(--sub);font-size:16px;line-height:1;}
  .search-close:hover{color:var(--ink)}
  .dark #searchInput{background:#2c2c30;border-color:var(--line);color:var(--ink)}
  .dark .search-nav{color:var(--sub);border-color:var(--line)}
  .dark .search-nav:hover{color:var(--brand);border-color:var(--brand)}
  .dark .search-close:hover{color:var(--ink)}
  /* 搜索高亮（品牌绿，不盖文字） */
  .textLayer .highlight{
    background:rgba(31,136,61,.12) !important;
    border-bottom:2px solid rgba(31,136,61,.35) !important;
    border-radius:1px;
  }
  .textLayer .highlight.selected{
    background:rgba(31,136,61,.25) !important;
    border-bottom:2px solid #1f883d !important;
  }
  /* 暗色模式高亮 */
  .dark .textLayer .highlight{
    background:rgba(31,136,61,.18) !important;
    border-bottom-color:rgba(31,136,61,.5) !important;
  }
  .dark .textLayer .highlight.selected{
    background:rgba(31,136,61,.35) !important;
    border-bottom-color:#2ea043 !important;
  }

  /* ── 确认弹框 ── */
  #modalOverlay{
    position:fixed;inset:0;background:rgba(0,0,0,.35);
    z-index:90;display:none;align-items:center;justify-content:center;
    animation:fadeIn .18s ease;
  }
  #modalOverlay.show{display:flex}
  #modalBox{
    background:var(--bar);border-radius:var(--radius);
    box-shadow:0 8px 30px rgba(0,0,0,.12);
    width:340px;max-width:90%;padding:28px 24px 20px;
    text-align:center;animation:scaleIn .2s ease;
  }
  #modalBox .modal-icon{font-size:28px;margin-bottom:10px;display:block;color:#c0392b;}
  #modalBox .modal-title{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:6px;}
  #modalBox .modal-desc{font-size:13px;color:var(--sub);line-height:1.5;margin-bottom:20px;}
  #modalBox .modal-actions{display:flex;gap:10px;justify-content:center;}
  #modalBox .modal-actions button{
    flex:1;padding:8px 0;border-radius:8px;border:none;
    font-size:13px;cursor:pointer;transition:all .12s;
    height:36px;
  }
  #modalBox .modal-cancel{background:#f5f5f7;color:var(--ink);}
  #modalBox .modal-cancel:hover{background:#e8e8ed;}
  #modalBox .modal-confirm{background:#c0392b;color:#fff;font-weight:500;}
  #modalBox .modal-confirm:hover{background:#a93226;}
  .dark #modalOverlay{background:rgba(0,0,0,.55)}
  .dark #modalBox .modal-cancel{background:#3a3a40;color:var(--ink)}
  .dark #modalBox .modal-cancel:hover{background:#4a4a50}
  .dark #modalBox .modal-confirm{background:#c0392b;color:#fff}
  .dark #modalBox .modal-confirm:hover{background:#a93226}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes scaleIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}

  /* ── 批注 ── */
  #annMenu{
    position:fixed;z-index:80;display:none;gap:4px;
    background:var(--bar);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:0 4px 16px rgba(0,0,0,.1);
    padding:4px;
  }
  #annMenu.show{display:flex}
  #annMenu button{
    border:none;background:transparent;padding:5px 12px;
    border-radius:6px;cursor:pointer;font-size:13px;color:var(--ink);
    white-space:nowrap;transition:background .12s;
  }
  #annMenu button:hover{background:#e8e8ed}
  .dark #annMenu button:hover{background:#3a3a40}
  .ann-hl{border-radius:2px;pointer-events:none;mix-blend-mode:multiply;}
  .dark .ann-hl{mix-blend-mode:screen;opacity:.5}
  .ann-cvr{pointer-events:auto;cursor:default;}
  .ann-cvr-btn{
    display:none;position:absolute;left:50%;top:calc(100% + 4px);transform:translateX(-50%);
    background:var(--bar);border:1px solid var(--line);
    border-radius:6px;padding:3px 10px;font-size:11px;color:var(--ink);cursor:pointer;
    white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:10;line-height:1.4;
    user-select:none;
  }
  .ann-cvr-btn:hover{background:#e8e8ed}
  .dark .ann-cvr-btn:hover{background:#3a3a40}
  /* 暗色模式下修正带继承与 canvas 相同的 filter，颜色和纸张一起变灰 */
  .dark .ann-cvr{filter:brightness(.55) saturate(.9)}
  .ann-bub{font-size:13px;line-height:1;filter:drop-shadow(0 1px 2px rgba(0,0,0,.15));margin-top:-14px;}
  .ann-bub svg{color:var(--brand);vertical-align:middle;}
  .ann-pop{
    position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    background:var(--bar);border:1px solid var(--line);
    border-radius:6px;padding:6px 10px;font-size:12px;color:var(--ink);
    white-space:nowrap;max-width:260px;overflow:hidden;text-overflow:ellipsis;
    box-shadow:0 2px 8px rgba(0,0,0,.08);pointer-events:none;z-index:10;
    margin-bottom:4px;
  }
  /* ── 批注输入：便签纸样式 ── */
  #annInputOverlay{
    position:fixed;z-index:95;display:none;
    width:260px;
    background:#f5faf3;border:1px solid #e3eee0;border-radius:8px;
    box-shadow:0 6px 24px rgba(20,50,20,.08),0 1px 2px rgba(20,50,20,.04);
    overflow:hidden;
    animation:scaleIn .12s ease;
  }
  #annInputOverlay.show{display:block}
  #annInputOverlay .head{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 6px 6px 12px;
    background:#eef6ec;
    border-bottom:1px solid #e3eee0;
    font-size:12px;color:#5a7a5a;font-weight:500;
    user-select:none;
  }
  #annInputOverlay .head svg{color:#5a7a5a;vertical-align:middle;margin-right:4px}
  #annInputOverlay .ann-close{
    width:22px;height:22px;border-radius:4px;border:none;
    background:transparent;color:#8aa590;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .12s;font-size:13px;line-height:1;
  }
  #annInputOverlay .ann-close:hover{background:rgba(31,136,61,.08);color:var(--brand)}
  #annInputBox{padding:8px;}
  #annInputBox textarea{
    width:100%;height:64px;resize:none;
    border:none;border-radius:6px;
    padding:6px 8px;font-size:13px;line-height:1.5;font-family:inherit;
    color:#2d4a2d;background:#fff;
    box-sizing:border-box;outline:none;
    transition:box-shadow .12s;
  }
  #annInputBox textarea:focus{box-shadow:0 0 0 2px rgba(31,136,61,.12)}
  #annInputBox textarea::placeholder{color:#a8c0a8;font-weight:300}
  #annInputBox .act{display:flex;justify-content:flex-end;margin-top:6px;}
  #annInputBox .btn-ok{
    height:24px;padding:0 10px;border-radius:12px;border:none;
    background:var(--brand);color:#fff;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;
    transition:all .12s;font-size:13px;line-height:1;
  }
  #annInputBox .btn-ok:hover{filter:brightness(.92)}
  #annInputBox .btn-ok svg{display:block}
  .dark #annInputOverlay{background:#1d2a1c;border-color:#2a3d29}
  .dark #annInputOverlay .head{background:#202f20;border-bottom-color:#2a3d29;color:#9bba9b}
  .dark #annInputOverlay .head svg{color:#9bba9b}
  .dark #annInputOverlay .ann-close{color:#6b8a6b}
  .dark #annInputOverlay .ann-close:hover{background:rgba(120,200,120,.1);color:#9bba9b}
  .dark #annInputBox textarea{
    background:#283828;border-color:transparent;color:#d4e4d4;
  }
  .dark #annInputBox textarea::placeholder{color:#5a7a5a}

  /* ── 批注编辑：便签纸样式（与新增一致） ── */
  #annEditOverlay{
    position:fixed;z-index:95;display:none;
    width:280px;
    background:#f5faf3;border:1px solid #e3eee0;border-radius:8px;
    box-shadow:0 6px 24px rgba(20,50,20,.08),0 1px 2px rgba(20,50,20,.04);
    overflow:hidden;
    animation:scaleIn .12s ease;
  }
  #annEditOverlay.show{display:block}
  #annEditOverlay .head{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 6px 6px 12px;
    background:#eef6ec;
    border-bottom:1px solid #e3eee0;
    font-size:12px;color:#5a7a5a;font-weight:500;
    user-select:none;
  }
  #annEditOverlay .head svg{color:#5a7a5a;vertical-align:middle;margin-right:4px}
  #annEditOverlay .ann-edit-close{
    width:22px;height:22px;border-radius:4px;border:none;
    background:transparent;color:#8aa590;cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    transition:all .12s;font-size:13px;line-height:1;
  }
  #annEditOverlay .ann-edit-close:hover{background:rgba(31,136,61,.08);color:var(--brand)}
  #annEditBox{padding:8px;}
  #annEditBox textarea{
    width:100%;height:64px;resize:none;
    border:none;border-radius:6px;
    padding:6px 8px;font-size:13px;line-height:1.5;font-family:inherit;
    color:#2d4a2d;background:#fff;
    box-sizing:border-box;outline:none;
    transition:box-shadow .12s;
  }
  #annEditBox textarea:focus{box-shadow:0 0 0 2px rgba(31,136,61,.12)}
  #annEditBox .act{display:flex;align-items:center;justify-content:space-between;margin-top:6px;}
  #annEditBox .act-left{display:flex;gap:6px;}
  #annEditBox .act-right{display:flex;gap:6px;}
  #annEditBox .act button{
    height:24px;padding:0 10px;border-radius:12px;border:none;
    font-size:12px;cursor:pointer;
    display:inline-flex;align-items:center;gap:4px;
    transition:all .12s;line-height:1;
  }
  #annEditBox .btn-del{background:transparent;color:#c0392b;border:1px solid #e8d4d0 !important}
  #annEditBox .btn-del:hover{background:#fbecea;border-color:#c0392b !important}
  #annEditBox .btn-save{background:var(--brand);color:#fff;}
  #annEditBox .btn-save:hover{filter:brightness(.92)}
  #annEditBox .act svg{width:12px;height:12px;display:block}
  .dark #annEditOverlay{background:#1d2a1c;border-color:#2a3d29}
  .dark #annEditOverlay .head{background:#202f20;border-bottom-color:#2a3d29;color:#9bba9b}
  .dark #annEditOverlay .head svg{color:#9bba9b}
  .dark #annEditOverlay .ann-edit-close{color:#6b8a6b}
  .dark #annEditOverlay .ann-edit-close:hover{background:rgba(120,200,120,.1);color:#9bba9b}
  .dark #annEditBox textarea{
    background:#283828;color:#d4e4d4;
  }
  .dark #annEditBox .btn-del{color:#e57373;border-color:#4a2c2a !important}
  .dark #annEditBox .btn-del:hover{background:#3a2828}

  /* settings dropdown menu */
  #settingsMenu{
    position:fixed;z-index:90;display:none;
    min-width:200px;padding:6px;
    background:var(--bar);border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 4px 20px rgba(0,0,0,.10),0 1px 4px rgba(0,0,0,.04);
    animation:scaleIn .15s ease;
    transform-origin:top right;
  }
  #settingsMenu.show{display:block}
  #settingsMenu .menu-item{
    display:flex;align-items:center;gap:10px;
    width:100%;padding:7px 10px;
    border:none;background:transparent;cursor:pointer;
    border-radius:6px;font-size:13px;color:var(--ink);
    text-align:left;line-height:1.4;user-select:none;
    transition:background .12s;
  }
  #settingsMenu .menu-item:hover{background:#e8e8ed}
  .dark #settingsMenu .menu-item:hover{background:#3a3a40}
  #settingsMenu .menu-item .check{
    width:14px;height:14px;flex-shrink:0;
    color:var(--brand);opacity:0;transition:opacity .12s;
  }
  #settingsMenu .menu-item.active .check{opacity:1}
  #settingsMenu .menu-item + .menu-item{margin-top:2px;border-top:1px solid var(--line);padding-top:9px;}
  .hide-pdf-annotations .annotationLayer{display:none!important}
  /* 暗色模式下 PDF 内嵌批注（高亮/便签）补强可读性 */
  .dark .annotationLayer .popup{background-color:#fff8c8 !important;color:#1d1d1f !important;box-shadow:0 4px 16px rgba(0,0,0,.4) !important;}
  .dark .annotationLayer .popup *{color:#1d1d1f !important;}

  /* ── 打印模式：仅打印 PDF 页面 ── */
  @media print{
    @page{margin:0}
    html,body,#app{height:auto!important;background:#fff!important;overflow:visible!important}
    #toolbar,#fsStrip,#empty,#tocPanel,#progBanner,#dropOverlay,#loading,#error{display:none!important}
    #viewerContainer{
      position:static!important;inset:auto!important;
      overflow:visible!important;background:#fff!important;
      height:auto!important;
    }
    .pdfViewer{padding:0!important;margin:0!important}
    .pdfViewer .page{
      margin:0 auto!important;border:0!important;
      box-shadow:none!important;break-after:page;page-break-after:always;
      filter:none!important;
    }
    .pdfViewer .page canvas{filter:none!important}
    .textLayer,.annotationLayer{display:none!important}
  }
</style>
</head>
<body>
<div id="app">
  <div id="fsStrip"></div>
  <div id="toolbar">

// IndexedDB：存储文件数据（用于重新打开）
function openDB(){
  return new Promise((resolve, reject) => {
    const req = indexedDB.open('PDFReaderData', 2);
    req.onupgradeneeded = () => {
      if(!req.result.objectStoreNames.contains('files')){
        req.result.createObjectStore('files', { keyPath: 'id' });
      }
      if(!req.result.objectStoreNames.contains('annotations')){
        const as = req.result.createObjectStore('annotations', { keyPath: 'id' });
        as.createIndex('fileId', 'fileId', { unique: false });
        as.createIndex('filePage', ['fileId', 'pageNum'], { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function saveFileData(id, data){
  try {
    const db = await openDB();
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').put({ id, data });
    await new Promise(r => { tx.oncomplete = r; });
    db.close();
  } catch(e){} // 大文件存不进 IndexedDB 时静默，列表依旧展示
}
async function getFileData(id){
  try {
    const db = await openDB();
    return await new Promise((resolve) => {
      const req = db.transaction('files').objectStore('files').get(id);
      req.onsuccess = () => { db.close(); resolve(req.result?.data); };
      req.onerror = () => { db.close(); resolve(null); };
    });
  } catch(e){ return null; }
}
async function deleteFileData(id){
  try {
    const db = await openDB();
    const tx = db.transaction('files', 'readwrite');
    tx.objectStore('files').delete(id);
    await new Promise(r => { tx.oncomplete = r; });
    db.close();
  } catch(e){}
}

// ── 批注 CRUD (IndexedDB annotations store) ──
async function saveAnnotation(ann){
  try {
    const db = await openDB();
    const tx = db.transaction('annotations', 'readwrite');
    tx.objectStore('annotations').put(ann);
    await new Promise(r => { tx.oncomplete = r; });
    db.close();
    // 更新缓存
    if(annDataCache){
      if(!annDataCache[ann.pageNum]) annDataCache[ann.pageNum] = [];
      const idx = annDataCache[ann.pageNum].findIndex(a => a.id === ann.id);
      if(idx >= 0) annDataCache[ann.pageNum][idx] = ann;
      else annDataCache[ann.pageNum].push(ann);
    }
  } catch(e){}
}
async function getAnnotations(fileId, pageNum){
  try {
    const db = await openDB();
    const tx = db.transaction('annotations', 'readonly');
    const store = tx.objectStore('annotations');
    let items;
    if(pageNum != null){
      const range = IDBKeyRange.only([fileId, pageNum]);
      items = await new Promise(r => { const req = store.index('filePage').getAll(range); req.onsuccess = () => r(req.result); });
    } else {
      items = await new Promise(r => { const req = store.index('fileId').getAll(fileId); req.onsuccess = () => r(req.result); });
    }
    db.close();
    return items || [];
  } catch(e){ return []; }
}
let annDataCache = null; // { [pageNum]: [annotation, ...] }
function getCachedAnnotations(){
  return annDataCache;
}
async function loadAnnotationsCache(fileId){
  const all = await getAnnotations(fileId);
  annDataCache = {};
  for(const a of all){
    if(!annDataCache[a.pageNum]) annDataCache[a.pageNum] = [];
    annDataCache[a.pageNum].push(a);
  }
}
function clearAnnotationsCache(){
  annDataCache = null;
}
async function deleteAnnotation(id){
  try {
    const db = await openDB();
    const tx = db.transaction('annotations', 'readwrite');
    tx.objectStore('annotations').delete(id);
    await new Promise(r => { tx.oncomplete = r; });
    db.close();
    // 更新缓存
    if(annDataCache){
      for(const pn in annDataCache){
        annDataCache[pn] = annDataCache[pn].filter(a => a.id !== id);
        if(annDataCache[pn].length === 0) delete annDataCache[pn];
      }
    }
  } catch(e){}
}
async function deleteAnnotationsByFile(fileId){
  const items = await getAnnotations(fileId);
  for(const a of items) await deleteAnnotation(a.id);
}

function renderAnnotations(pageNum){
  const pageEl = document.querySelector(`.page[data-page-number="${pageNum}"]`);
  if(!pageEl) return;
  const fid = lastFileId;
  if(!fid) return;
  // 优先使用缓存（同步，无闪烁）
  const cache = getCachedAnnotations();
  if(cache){
    applyAnnotationsToPage(pageEl, cache[pageNum] || []);
    return;
  }
  // 缓存未就绪时异步从 IDB 读取
  getAnnotations(fid, pageNum).then(list => {
    applyAnnotationsToPage(pageEl, list || []);
  });
}
function applyAnnotationsToPage(pageEl, list){
  if(!pageEl || !pageEl.isConnected) return;
  const pw = pageEl.offsetWidth, ph = pageEl.offsetHeight;
  if(pw < 1 || ph < 1) return;
  const div = document.createElement('div');
  div.className = 'anns';
  div.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;';
  if(list.length > 0){
      for(const a of list){
        const isCover = a.type === 'cover';
        for(const r of a.rects){
          const hl = document.createElement('div');
          if(isCover){
            hl.className = 'ann-cvr';
            hl.style.cssText = `position:absolute;left:${r.left*pw}px;top:${r.top*ph}px;width:${r.width*pw}px;height:${r.height*ph}px;background:#fff;`;
            const btn = document.createElement('div');
            btn.className = 'ann-cvr-btn';
            btn.textContent = '↩ 撤回';
            btn.style.display = 'none';
            hl.appendChild(btn);
            hl.addEventListener('click', function(e){
              e.stopPropagation();
              const showing = btn.style.display === 'block';
              // 关闭所有其他修正带的撤回按钮
              document.querySelectorAll('.ann-cvr-btn').forEach(b => b.style.display = 'none');
              if(!showing) btn.style.display = 'block';
            });
            btn.addEventListener('click', function(e){
              e.stopPropagation();
              btn.style.display = 'none';
              deleteAnnotation(a.id).then(() => {
                for(let i = 1; pdfDoc && i <= pdfDoc.numPages; i++) renderAnnotations(i);
              });
            });
          } else {
            hl.className = 'ann-hl';
            hl.style.cssText = `position:absolute;left:${r.left*pw}px;top:${r.top*ph}px;width:${r.width*pw}px;height:${r.height*ph}px;background:rgba(255,212,0,.35);pointer-events:none;border-radius:2px;`;
          }
          div.appendChild(hl);
        }
        if(isCover) continue;
        const bub = document.createElement('span');
        bub.className = 'ann-bub';
        bub.dataset.aid = a.id;
        bub.title = a.annotation || '';
        bub.style.cssText = `position:absolute;left:${a.bubX*pw}px;top:${a.bubY*ph}px;cursor:pointer;pointer-events:auto;z-index:3;`;
        bub.innerHTML = '<svg viewBox="0 0 1024 1024" fill="currentColor" width="16" height="16" style="vertical-align:middle"><path d="M960.1 147.6c-18.2-16.5-41.9-25.6-66.7-25.6H131.7c-24.9 0-48.3 9.3-65.9 26.3C47.9 165.5 38 188.7 38 213.6v439.5c0 51.2 42 92.9 93.7 92.9H569v150.2c0 12.4 7.6 23.5 19.1 28 3.5 1.4 7.2 2 10.9 2 8.2 0 16.3-3.4 22.1-9.7L777.8 746h115.5c52.4 0 96.6-42.6 96.6-92.9V213.6c0.1-25.1-10.5-48.5-29.8-66zM930 653.1c0 17.2-17.4 32.9-36.6 32.9H764.7c-8.4 0-16.4 3.5-22.1 9.7L629 819.2V716c0-16.6-13.4-30-30-30H131.7c-18.6 0-33.7-14.8-33.7-32.9V213.6c0-17.7 14.8-31.6 33.7-31.6h761.7c19.5 0 36.6 14.8 36.6 31.6v439.5z" fill="currentColor"></path></svg>';
        const pop = document.createElement('div');
        pop.className = 'ann-pop';
        pop.style.cssText = 'position:absolute;bottom:100%;left:50%;transform:translateX(-50%);display:none;';
        pop.textContent = a.annotation || '';
        bub.appendChild(pop);
        bub.addEventListener('mouseenter', () => { pop.style.display = 'block'; });
        bub.addEventListener('mouseleave', () => { pop.style.display = 'none'; });
        bub.addEventListener('click', (e) => {
          e.stopPropagation();
          showAnnotationEditor(a, bub);
        });
        div.appendChild(bub);
      }
    }
    // 新旧交换（原子操作，旧的在新的就位后才移除）
    const old = pageEl.querySelector('.anns');
    if(old) old.remove();
    if(list.length > 0) pageEl.appendChild(div);
}

async function renderAnnotation(inputText, selectedRects, pageNum, selectedText, type){
  const a = {
    id: Date.now() + '_' + Math.random().toString(36).slice(2, 6),

function renderRecentFiles(list){
  recentFilesEl.innerHTML = '';
  if(!list || list.length === 0) return;
  const now = Date.now();
  let html = '<div class="rf-title">最近打开</div>';
  for(const item of list){
    const diff = now - item.time;
    let timeStr = '';
    if(diff < 60000) timeStr = '刚刚';
    else if(diff < 3600000) timeStr = Math.floor(diff/60000) + ' 分钟前';
    else if(diff < 86400000) timeStr = Math.floor(diff/3600000) + ' 小时前';
    else timeStr = Math.floor(diff/86400000) + ' 天前';
    html += `<div class="rf-item" data-id="${item.id}">
      <span class="rf-name">${escapeHtml(item.name)}</span>
      <span class="rf-time">${timeStr}</span>
      <button class="rf-del" data-id="${item.id}" title="删除">✕</button>
    </div>`;
  }
  html += '<button class="rf-clear" id="clearAllBtn">全部清空</button>';
  recentFilesEl.innerHTML = html;
}

function loadRecentFiles(){
  // 从 localStorage 读列表（轻量可靠），不依赖 IndexedDB
  let list = getRecentList();
  // 启动时去重：同名文件只保留最近的一条
  const seen = new Set();
  list = list.filter(item => {
    if(seen.has(item.name)) return false;
    seen.add(item.name);
    return true;
  });
  saveRecentList(list);
  // 异步清理已不存在的 IndexedDB 记录
  scheduleCleanup(list);
  renderRecentFiles(list);
}
function scheduleCleanup(list){
  // 静默清理：检查 IndexedDB 中是否有已不在列表中的孤立记录
  setTimeout(async () => {
    try {
      const db = await openDB();
      const keys = await new Promise(resolve => {
        const req = db.transaction('files').objectStore('files').getAllKeys();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => resolve([]);
      });
      db.close();
      const validIds = new Set(list.map(i => i.id));
      for(const key of keys){
        if(!validIds.has(key)) await deleteFileData(key);
      }
    } catch(e){}
  }, 2000);
}

// 保存最近打开记录
async function saveRecentFile(name, data){
  const list = getRecentList();
  const finalName = name || '未命名.pdf';
  // 同名文件：复用现有记录，移到首位 + 更新时间，避免重复条目
  const existingIdx = list.findIndex(i => i.name === finalName);
  let id;
  if(existingIdx >= 0){
    id = list[existingIdx].id;
    list.splice(existingIdx, 1);
    list.unshift({ id, name: finalName, time: Date.now() });
  } else {
    // 新文件：生成唯一 ID（时间戳 + 短随机）
    id = Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    list.unshift({ id, name: finalName, time: Date.now() });
  }
  // 截断到 MAX_RECENT 条，多余的删除 IndexedDB 数据
  const removed = list.splice(MAX_RECENT);
  saveRecentList(list);
  // 存文件数据到 IndexedDB（大文件可能失败）
  await saveFileData(id, data);
  // 删除超出的 IndexedDB 记录
  for(const r of removed) await deleteFileData(r.id);
  // 刷新列表显示
  renderRecentFiles(list);
}

// 点击最近文件重新打开 / 删除
recentFilesEl.addEventListener('click', async (e) => {
  // ── 单个删除 ──
  const delBtn = e.target.closest('.rf-del');
  if(delBtn){
    e.stopPropagation();
    const id = delBtn.dataset.id;
    if(!id) return;
    const list = getRecentList();
    const updated = list.filter(i => i.id !== id);
    if(updated.length === list.length) return; // 没找到
    saveRecentList(updated);
    await deleteFileData(id);
    renderRecentFiles(updated);
    return;
  }
  // ── 全部清空（自定义弹框确认） ──
  if(e.target.id === 'clearAllBtn'){
    document.getElementById('modalOverlay').classList.add('show');
    return;
  }
  // ── 打开文件 ──
  const item = e.target.closest('.rf-item');
  if(!item) return;
  const id = item.dataset.id;
  if(!id) return;
  showLoading();
  try {
    const data = await getFileData(id);
    if(!data){
      hideLoading();
      showError('文件数据已丢失，请重新选择文件');
      return;
    }
    const list = getRecentList();
    const found = list.find(i => i.id === id);
    const fileName = found ? found.name : 'document.pdf';
    const file = new File([data], fileName, { type: 'application/pdf' });
    loadFile(file, { historyId: id });
  } catch(e){
    hideLoading();
    showError('打开失败: ' + e.message);
  }
});

function showLoading(){ loading.classList.add('show'); }
function hideLoading(){ loading.classList.remove('show'); }
function showError(msg){ errorBox.textContent = msg; errorBox.classList.add('show'); setTimeout(()=>errorBox.classList.remove('show'), 4500); }
function hideEmpty(){
  empty.style.display = 'none';
  const footer = document.getElementById('appFooter');
  if(footer) footer.style.display = 'none';
  const pageGrp = document.getElementById('pageGrp');
  if(pageGrp) pageGrp.style.display = '';
}

function applySpread(){
  const narrow = window.innerWidth <= NARROW;
  pdfViewer.spreadMode = (isTwoPage && !narrow)
    ? SpreadMode.ODD
    : SpreadMode.NONE;
}

function setMode(two){
  isTwoPage = two;
  modeSingle.classList.toggle('active', !two);
  modeTwo.classList.toggle('active', two);
  applySpread();
  updatePageInfo();
}

function updateZoomLabel(){
  const pct = Math.round((pdfViewer.currentScale || 1) * 100);
  zoomVal.textContent = pct + '%';
}

function visiblePageRange(){
  // 双排：用 pdf.js 自带的 _getVisiblePages() 拿真实可见页号集合（比手算 boundingRect 准）
  const vis = pdfViewer._getVisiblePages && pdfViewer._getVisiblePages();
  if(vis && vis.ids && vis.ids.size > 0){
    const ids = [...vis.ids].sort((a,b)=>a-b);
    return [ids[0], ids[ids.length-1]];
  }
  // 兜底：用 pdf.js 维护的 currentPageNumber
  const cur = pdfViewer.currentPageNumber || 1;
  return [cur, cur];
}

function updatePageInfo(){
  if(!pdfDoc) return;
  const total = pdfDoc.numPages;
  const narrow = window.innerWidth <= NARROW;
  const two = isTwoPage && !narrow;
  const [a, b] = visiblePageRange();
  if(a === null){ pageInfo.textContent = `第 ? / ${total} 页`; return; }
  if(two && b > a){
    pageInfo.textContent = `第 ${a}-${b} / ${total} 页`;
  } else {
    pageInfo.textContent = `第 ${a} / ${total} 页`;
  }
}

// ---------- TOC 目录 ----------
async function resolveDestToPage(dest){
  try {
    if(typeof dest === 'string') dest = await pdfDoc.getDestination(dest);
    if(Array.isArray(dest) && dest[0]){
      if(typeof dest[0] === 'number') return dest[0];
      const idx = await pdfDoc.getPageIndex(dest[0]);
      return idx + 1;
    }
  } catch(e) {}
  return null;
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]||c}) }
async function loadOutline(){
  if(!pdfDoc){ tocPanel.innerHTML='<div class="toc-empty">打开 PDF 后可查看目录</div>'; return; }
  try {
    const outline = await pdfDoc.getOutline();
    if(!outline || outline.length===0){
      tocPanel.innerHTML='<div class="toc-empty">本 PDF 无目录结构</div>';
      tocBtn.classList.remove('active'); return;
    }
    async function buildTree(items, depth){
      let html='';
      for(const item of items){
        let pn = item.dest ? await resolveDestToPage(item.dest) : null;
        html+=`<div class="toc-item" style="padding-left:${14+depth*18}px" data-page="${pn||''}">`;
        html+=`<span>${escapeHtml(item.title)}</span>`;
        if(pn) html+=`<span class="toc-page">${pn}</span>`;
        html+=`</div>`;
        if(item.items&&item.items.length) html+=await buildTree(item.items,depth+1);
      }
      return html;
    }
    tocPanel.innerHTML = await buildTree(outline,0);
  } catch(e){
    tocPanel.innerHTML='<div class="toc-empty">目录加载失败</div>';
  }
}

const PROGRESS_KEY = 'pdfReaderLastProgress';
function saveProgress(){
  if(!pdfDoc||!lastFileName||!pdfViewer.currentPageNumber) return;
  try {
    localStorage.setItem(PROGRESS_KEY, JSON.stringify({
      name: lastFileName, page: pdfViewer.currentPageNumber, time: Date.now()
    }));
  } catch(e) {}
}
function checkProgress(fileName){
  try {
    const d = JSON.parse(localStorage.getItem(PROGRESS_KEY));
    if(d && d.name===fileName && d.page) return d;
  } catch(e) {}
  return null;
}
function dismissProgress(){
  progBanner.classList.remove('show');
  localStorage.removeItem(PROGRESS_KEY);
}
function hideProgress(){
  progBanner.classList.remove('show');
}

// ---------- load ----------
async function loadFile(file, options = {}){
  if(!file) return;
  const name = (file.name || '').toLowerCase();
  if(file.type && file.type !== 'application/pdf' && !name.endsWith('.pdf')){
    showError('请选择 PDF 文件'); return;
  }
  showLoading();
  try{
    const sourceData = await file.arrayBuffer();
    // pdf.js 会把传入的 ArrayBuffer 转移给 Worker，原 buffer 会变成 0 字节。
    // 必须在 getDocument 前复制两份：一份用于打印/历史，一份交给 pdf.js。
    const historyData = sourceData.slice(0);
    const pdfData = sourceData.slice(0);
    pdfRawData = historyData;
    if(pdfDoc){ pdfViewer.setDocument(null); findController.setDocument(null); linkService.setDocument(null); pdfDoc = null; }
    pdfDoc = await pdfjsLib.getDocument({
      data: pdfData,
      // 启用 CJK 字符映射 + 标准字体数据 + 系统字体回退，解决中文/部分字符无法显示的问题
      cMapUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/cmaps/',
      cMapPacked: true,
      standardFontDataUrl: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/standard_fonts/',
      useSystemFonts: true,
    }).promise;
    pdfViewer.setDocument(pdfDoc);
    pdfViewer.scrollMode = ScrollMode.VERTICAL;
    linkService.setDocument(pdfDoc);
    findController.setDocument(pdfDoc);
    jumpInput.max = pdfDoc.numPages;
    jumpInput.placeholder = '页';
    // 关键：等 pagesloaded 再设置 scale/spread，否则 _pages 为空时 update() 触发解构 undefined 的 pageView 报错
    await new Promise(resolve => {
      const h = () => resolve();
      pdfViewer.eventBus.on('pagesloaded', h);
      // 兜底超时 5s（极少数 PDF 没有 outline/pages 事件）
      setTimeout(()=>{ pdfViewer.eventBus.off('pagesloaded', h); resolve(); }, 5000);
    });
    pdfViewer.currentScaleValue = 1;
    applySpread();
    hideEmpty();
    hideLoading();
    updateZoomLabel();
    updatePageInfo();
    // V1.1
    lastFileName = file.name || '';
    // 确定 fileId：历史记录复用旧 ID，新文件检查最近列表是否同名，避免 ID 不一致导致批注丢失
    if(options.historyId){
      lastFileId = options.historyId;
    } else {
      const existingEntry = getRecentList().find(i => i.name === (file.name || '未命名.pdf'));
      lastFileId = existingEntry ? existingEntry.id : (Date.now().toString(36) + Math.random().toString(36).slice(2,6));
    }
    // 预加载批注缓存（避免打开文件时异步读 IDB 导致闪烁）
    loadAnnotationsCache(lastFileId).then(() => setTimeout(renderAllAnnotations, 0));
    document.title = file.name || '云轩 PDF 阅读器 · 网页版';
    loadOutline();
    // 保存到最近打开记录（历史记录重开时只更新时间，不重复写文件数据）
    if(options.historyId){
      const list = getRecentList();
      const idx = list.findIndex(i => i.id === options.historyId);
      if(idx >= 0){
        const record = list.splice(idx, 1)[0];
        record.time = Date.now();
        list.unshift(record);
        saveRecentList(list);
        renderRecentFiles(list);
      }
    } else {
      saveRecentFile(file.name || '未命名.pdf', historyData);
    }
    const prog = checkProgress(lastFileName);
    if(prog && prog.page > 1){
      if(getAutoJump()){
        // 自动跳转：先设页码减少闪烁，等渲染完成再跳转确保生效
        pdfViewer.currentPageNumber = prog.page;
        requestAnimationFrame(() => pdfViewer.scrollPageIntoView({ pageNumber: prog.page }));
      } else {
        progPage.textContent = prog.page;
        progBanner.classList.add('show');
      }
    }
    if(tocPanel.classList.contains('show')) loadOutline();
  }catch(err){
    hideLoading();
    showError('文件无法打开：' + (err && err.message ? err.message : err));
  }
}

function showTempHighlight(){
  removeTempHighlight();
  if(!annSelectedRects || !annSelectedPage) return;
  const pageEl = document.querySelector(`.page[data-page-number="${annSelectedPage}"]`);
  if(!pageEl) return;
  const pw = pageEl.offsetWidth, ph = pageEl.offsetHeight;
  if(pw < 1 || ph < 1) return;
  const div = document.createElement('div');
  div.className = 'anns';
  div.style.cssText = 'position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;';
  for(const r of annSelectedRects){

    div.appendChild(hl);
  }
  pageEl.appendChild(div);
  annTempEl = div;
}

  }
}

// 鼠标选中文字 → 显示浮动菜单
document.addEventListener('mouseup', (e) => {
  const sel = window.getSelection();
  // 点击在批注 UI 内，不触发任何菜单关闭逻辑
  if(e.target.closest('#annMenu, #annInputOverlay, #annEditOverlay')) return;
  if(!sel || sel.isCollapsed || !sel.toString().trim()) {
    hideAnnMenu();
    return;
  }
  // 如果菜单已显示 + 选中文字和上次相同 → 点选已有文字，隐藏菜单
  if(annMenu.classList.contains('show') && sel.toString().trim() === annSelectedText){
    hideAnnMenu();
    return;
  }
  // 只处理在 viewer 内的选中
  if(!e.target.closest('.pdfViewer')) return;
  const text = sel.toString().trim();
  if(text.length < 1 || text.length > 500) return;
  // 获取选中范围的矩形
  const range = sel.getRangeAt(0);
  if(!range) return;
  const rects = Array.from(range.getClientRects()).filter(r => r.width > 2 && r.height > 2);
  if(rects.length === 0) return;
  // 定位到页面坐标（百分比）
  const pageEl = e.target.closest('.page');
  if(!pageEl) return;
  const pageNum = parseInt(pageEl.dataset.pageNumber, 10);
  if(!pageNum) return;
  const pr = pageEl.getBoundingClientRect();
  if(pr.width < 1) return;
  const rectsPct = rects.map(r => ({
    left: (r.left - pr.left) / pr.width,
    top: (r.top - pr.top) / pr.height,
    width: r.width / pr.width,
    height: r.height / pr.height
  }));
  annSelectedRects = rectsPct;
  annSelectedText = text;
  annSelectedPage = pageNum;
  // 定位浮动菜单
  const lastR = rects[rects.length - 1];
  let mx = lastR.right + 6;
  let my = lastR.top - 4;
  const menuW = 120;
  if(mx + menuW > window.innerWidth) mx = lastR.left - menuW - 6;
  if(my < 4) my = lastR.bottom + 4;
  annMenu.style.left = mx + 'px';
  annMenu.style.top = my + 'px';
  annMenu.classList.add('show');
});

  let ix = mRect.left;
  let iy = mRect.bottom + 6;
  const iw = 260;
  const ih = 160;
  if(ix + iw > window.innerWidth - 8) ix = window.innerWidth - iw - 8;
  if(iy + ih > window.innerHeight - 8) iy = mRect.top - ih - 6;
  if(iy < 8) iy = 8;
  annInputOverlay.style.left = ix + 'px';
  annInputOverlay.style.top = iy + 'px';
  annInputOverlay.classList.add('show');
  annInputText.value = '';
  annInputText.focus();
});

// 修正带
annCover.addEventListener('click', () => {
  if(!annSelectedRects) return;
  renderAnnotation('', annSelectedRects, annSelectedPage, annSelectedText, 'cover');
  hideAnnMenu();
});

// 关闭输入框
annInputClose.addEventListener('click', () => {
  annInputOverlay.classList.remove('show');
  removeTempHighlight();
  hideAnnMenu();
});

// 确认保存
annInputOk.addEventListener('click', () => {
  const ann = annInputText.value.trim();
  if(!ann || !annSelectedRects) return;
  renderAnnotation(ann, annSelectedRects, annSelectedPage, annSelectedText);
  annInputOverlay.classList.remove('show');
  hideAnnMenu();
});

// 编辑批注：保存修改
annEditSave.addEventListener('click', () => {
  const id = annEditText.dataset.aid;
  if(!id) return;
  const newText = annEditText.value.trim();
  getAnnotations(lastFileId).then(all => {
    const target = all.find(a => a.id === id);
    if(target){
      target.annotation = newText;
      saveAnnotation(target);
      renderAnnotations(target.pageNum);
    }
  });
  annEditOverlay.classList.remove('show');
});
// 编辑批注：删除
annEditDel.addEventListener('click', () => {
  const id = annEditText.dataset.aid;
  if(!id) return;
  deleteAnnotation(id).then(() => {
    // 找到对应页码重新渲染
    for(let i = 1; pdfDoc && i <= pdfDoc.numPages; i++) renderAnnotations(i);
  });
  annEditOverlay.classList.remove('show');
});
annEditClose.addEventListener('click', () => annEditOverlay.classList.remove('show'));

// ── 设置 ──
const settingsBtn = document.getElementById('settingsBtn');
const settingsMenu = document.getElementById('settingsMenu');
const togglePdfAnnotations = document.getElementById('togglePdfAnnotations');
function applyPdfAnnotations(visible){
  document.documentElement.classList.toggle('hide-pdf-annotations', !visible);
  togglePdfAnnotations.classList.toggle('active', visible);
  try { localStorage.setItem('pdfShowAnnotations', visible ? '1' : ''); } catch(e){}
}
const toggleAutoJump = document.getElementById('toggleAutoJump');
function applyAutoJump(enabled){
  toggleAutoJump.classList.toggle('active', enabled);
  try { localStorage.setItem('pdfAutoJump', enabled ? '1' : ''); } catch(e){}
}
function getAutoJump(){
  return localStorage.getItem('pdfAutoJump') === '1';
}
// 读取已保存的偏好
try {
  const saved = localStorage.getItem('pdfShowAnnotations') === '1';
  applyPdfAnnotations(saved);
} catch(e){ applyPdfAnnotations(false); }
// 自动跳转设置
try { applyAutoJump(localStorage.getItem('pdfAutoJump') === '1'); } catch(e){}
function toggleSettingsMenu(){
  if(settingsMenu.classList.contains('show')){
    settingsMenu.classList.remove('show');
    return;
  }
  // 定位到设置按钮下方
  const r = settingsBtn.getBoundingClientRect();
  settingsMenu.style.top = (r.bottom + 6) + 'px';
  settingsMenu.style.right = (window.innerWidth - r.right) + 'px';
  settingsMenu.classList.add('show');
}
settingsBtn.addEventListener('click', (e) => {
  e.stopPropagation();
  toggleSettingsMenu();
});
// 点击非修正带区域关闭撤回按钮
document.addEventListener('click', (e) => {
  if(!e.target.closest('.ann-cvr,.ann-cvr-btn')) document.querySelectorAll('.ann-cvr-btn').forEach(b => b.style.display = 'none');
});

togglePdfAnnotations.addEventListener('click', (e) => {
  e.stopPropagation();
  const visible = !togglePdfAnnotations.classList.contains('active');
  applyPdfAnnotations(visible);
});
toggleAutoJump.addEventListener('click', (e) => {
  e.stopPropagation();
  const enabled = !toggleAutoJump.classList.contains('active');
  applyAutoJump(enabled);
});
// 点击其他区域关闭
document.addEventListener('click', (e) => {
  if(!settingsMenu.classList.contains('show')) return;
  if(!e.target.closest('#settingsMenu, #settingsBtn')){
    settingsMenu.classList.remove('show');
  }
});
window.addEventListener('scroll', () => {
  if(settingsMenu.classList.contains('show')) settingsMenu.classList.remove('show');
}, true);

// 缩放后重新渲染批注（位置百分比随页面尺寸变化）
pdfViewer.eventBus.on('scalechanging', () => { renderAllAnnotations(); });
// 页面加载后渲染批注
pdfViewer.eventBus.on('pagesloaded', () => { setTimeout(renderAllAnnotations, 200); });

// 清除批注（goHome 时）
function clearAnnotations(){
  document.querySelectorAll('.anns').forEach(el => el.remove());
}

// 打开新文件时先渲染已有批注
// 已由 pagesloaded 事件处理
// 在 goHome 中清除批注（hook 进去）
const origGoHome = goHome;
// 附加到 goHome 里

// initial
document.getElementById('footerYear').textContent = new Date().getFullYear();
applySpread();
updateZoomLabel();
loadRecentFiles();
</script>
