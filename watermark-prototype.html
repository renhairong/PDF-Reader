<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>去水印 · 原型预览</title>
<style>
  :root{
    --bg:#f5f5f7; --panel:#fff; --ink:#1d1d1f; --sub:#86868b;
    --line:#e5e5ea; --brand:#0a84ff; --brand-hover:#0a6fd6;
    --green:#34c759; --red:#ff3b30; --blue-rgba:rgba(10,132,255,.18);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding:40px 20px}
  .page-tip{text-align:center;color:var(--sub);font-size:13px;margin-bottom:24px;line-height:1.8}
  .page-tip b{color:var(--ink)}

  /* ── 模拟应用窗口（原型外壳）── */
  .app-window{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.08)}
  .toolbar{display:flex;align-items:center;gap:6px;padding:10px 16px;border-bottom:1px solid var(--line);background:#fafafa}
  .tb-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);font-size:13px;cursor:pointer;transition:.15s}
  .tb-btn:hover{background:#f0f0f0}
  .tb-btn.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .tb-title{font-size:14px;font-weight:600;margin-left:8px;color:var(--sub)}
  .tb-spacer{flex:1}

  /* ── 模拟 PDF 页面内容 ── */
  .pdf-viewer{background:#d8d8dd;padding:28px 36px}
  .pdf-page{background:#fff;max-width:560px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.15);border-radius:2px;padding:36px 40px;position:relative;min-height:420px}
  .wm-mark{position:absolute;top:26px;left:50%;transform:translateX(-50%);color:#e53935;font-size:22px;font-weight:800;letter-spacing:6px;opacity:.55;user-select:none;white-space:nowrap}
  .page-line{height:11px;border-radius:3px;background:#e8e8ec;margin-bottom:10px}
  .page-line.short{width:68%}
  .page-line.mid{width:84%}
  .page-line.gray{background:#f0f0f3}
  .page-title{height:16px;background:#d6d6da;border-radius:3px;margin-bottom:16px;width:42%}
  /* 蓝色识别框（叠加在水印上）*/
  .wm-box{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:240px;height:52px;border:2px dashed rgba(10,132,255,.85);background:var(--blue-rgba);border-radius:4px;pointer-events:none}
  .wm-tag{position:absolute;top:-10px;right:-4px;background:var(--brand);color:#fff;font-size:10px;padding:1px 6px;border-radius:8px;font-weight:600}

  /* ── 去水印弹框 ── */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:999}
  .overlay.show{display:flex}
  .wm-modal{width:520px;max-width:94vw;background:var(--panel);border-radius:14px;box-shadow:0 24px 80px rgba(0,0,0,.3);overflow:hidden;animation:pop .18s ease}
  @keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
  .wm-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
  .wm-head h3{font-size:15px;font-weight:600}
  .wm-close{width:26px;height:26px;border:none;background:#f0f0f3;border-radius:50%;cursor:pointer;font-size:14px;color:var(--sub);display:flex;align-items:center;justify-content:center}
  .wm-close:hover{background:#e2e2e6;color:var(--ink)}
  .wm-body{padding:18px}
  /* 预览区 */
  .wm-preview-wrap{background:#e9e9ee;border-radius:10px;padding:14px;position:relative}
  .wm-preview{background:#fff;border-radius:3px;min-height:200px;padding:22px 26px;position:relative;box-shadow:0 1px 6px rgba(0,0,0,.12)}
  .wm-preview .page-line{height:8px;margin-bottom:7px}
  .wm-preview .page-title{height:11px;margin-bottom:11px}
  .wm-preview .wm-mark{font-size:14px;top:16px;letter-spacing:4px}
  .wm-preview .wm-box{width:150px;height:32px;top:8px;border-width:1.5px}
  .wm-loading{position:absolute;inset:0;background:rgba(255,255,255,.82);border-radius:10px;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;z-index:5}
  .wm-loading.show{display:flex}
  .spinner{width:26px;height:26px;border:3px solid #d8d8dd;border-top-color:var(--brand);border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .wm-loading span{font-size:12px;color:var(--sub)}
  /* 控制行 */
  .wm-opts{display:flex;align-items:center;justify-content:space-between;margin-top:14px}
  .wm-check{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
  .wm-check input{width:15px;height:15px;accent-color:var(--brand);cursor:pointer}
  .wm-pager{display:flex;align-items:center;gap:4px}
  .pg-btn{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .pg-btn:hover:not(:disabled){background:#f0f0f0}
  .pg-btn:disabled{opacity:.35;cursor:default}
  .pg-input{width:42px;height:28px;border:1px solid var(--line);border-radius:6px;text-align:center;font-size:13px}
  .pg-sep{font-size:12px;color:var(--sub)}
  .wm-result{margin-top:12px;font-size:12.5px;color:var(--sub);display:flex;align-items:center;gap:6px}
  .wm-result b{color:var(--brand)}
  .wm-result.ok{color:var(--green)}
  .wm-result.err{color:var(--red)}
  /* 删除按钮 */
  .wm-footer{padding:14px 18px;border-top:1px solid var(--line)}
  .wm-del{width:100%;padding:12px;border:none;border-radius:9px;background:var(--brand);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px}
  .wm-del:hover:not(:disabled){background:var(--brand-hover)}
  .wm-del:disabled{opacity:.5;cursor:default}
  .wm-del .mini-spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;display:none;animation:spin .8s linear infinite}
  .wm-del.loading .mini-spin{display:block}

  /* 首页水印描述 */
  .wm-desc{max-width:600px;margin:24px auto 0;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 20px;font-size:13px;color:var(--sub);line-height:1.9}
  .wm-desc b{color:var(--ink)}
</style>
</head>
<body>

<div class="page-tip">
  <b>去水印功能 · 原型预览</b><br>
  点击工具栏"去水印"按钮 → 弹出弹框。可体验：识别水印 → 预览切换 → 翻页 → 删除流程
</div>

<!-- ══ 模拟应用窗口 ══ -->
<div class="app-window">
  <div class="toolbar">
    <button class="tb-btn">📂 打开</button>
    <button class="tb-btn active" id="openWmBtn">🧹 去水印</button>
    <button class="tb-btn">🖨 打印</button>
    <button class="tb-btn">⬇ 下载</button>
    <span class="tb-title">三联生活周刊.pdf · 249 页</span>
    <span class="tb-spacer"></span>
  </div>
  <div class="pdf-viewer">
    <div class="pdf-page">
      <div class="wm-mark">三联生活周刊</div>
      <div class="wm-box"></div>
      <div class="page-title"></div>
      <div class="page-line"></div>
      <div class="page-line"></div>
      <div class="page-line short"></div>
      <div class="page-line gray"></div>
      <div class="page-line mid"></div>
      <div class="page-line"></div>
      <div class="page-line gray short"></div>
      <div class="page-line mid"></div>
      <div class="page-line"></div>
      <div class="page-line gray"></div>
      <div class="page-line short"></div>
    </div>
  </div>
</div>

<!-- ══ 去水印弹框 ══ -->
<div class="overlay" id="wmOverlay">
  <div class="wm-modal">
    <div class="wm-head">
      <h3>🧹 去水印</h3>
      <button class="wm-close" id="wmClose">✕</button>
    </div>
    <div class="wm-body">
      <!-- 预览 -->
      <div class="wm-preview-wrap">
        <div class="wm-preview" id="wmPreview">
          <div class="wm-mark" id="preMark">三联生活周刊</div>
          <div class="wm-box" id="preBox"></div>
          <div class="page-title"></div>
          <div class="page-line"></div>
          <div class="page-line"></div>
          <div class="page-line short"></div>
          <div class="page-line gray"></div>
          <div class="page-line mid"></div>
          <div class="page-line"></div>
          <div class="page-line gray short"></div>
        </div>
        <div class="wm-loading" id="preLoading">
          <div class="spinner"></div>
          <span>正在识别水印…</span>
        </div>
      </div>

      <!-- 选项 + 翻页 -->
      <div class="wm-opts">
        <label class="wm-check">
          <input type="checkbox" id="previewWm" checked>
          预览水印效果
        </label>
        <div class="wm-pager">
          <button class="pg-btn" id="pgFirst" title="首页">|◀</button>
          <button class="pg-btn" id="pgPrev" title="上一页">◀</button>
          <input class="pg-input" id="pgInput" value="1">
          <span class="pg-sep" id="pgTotal">/ 249</span>
          <button class="pg-btn" id="pgNext" title="下一页">▶</button>
          <button class="pg-btn" id="pgLast" title="末页">▶|</button>
        </div>
      </div>

      <!-- 识别结果 -->
      <div class="wm-result" id="wmResult">
        <span>🔍</span><span id="wmResultText">识别中…</span>
      </div>
    </div>

    <div class="wm-footer">
      <button class="wm-del" id="wmDelBtn">
        <span class="mini-spin"></span>
        <span id="wmDelLabel">删除水印</span>
      </button>
    </div>
  </div>
</div>

<div class="wm-desc">
  <b>交互说明：</b><br>
  ① 打开弹框后自动识别当前 PDF 的水印（蓝色虚线框标注位置）<br>
  ② <b>预览水印效果</b>：勾选 = 显示水印 + 识别框；取消 = 模拟"已删除"效果<br>
  ③ 翻页查看各页（原型为演示，页码变化但内容不变）<br>
  ④ 点击 <b>删除水印</b> → loading → 自动下载「原文件名_无水印.pdf」+ 提示完成
</div>

<script>
const overlay = document.getElementById('wmOverlay');
const openBtn = document.getElementById('openWmBtn');
const closeBtn = document.getElementById('wmClose');
const preMark = document.getElementById('preMark');
const preBox = document.getElementById('preBox');
const previewWm = document.getElementById('previewWm');
const wmLoading = document.getElementById('preLoading');
const wmResultText = document.getElementById('wmResultText');
const wmResult = document.getElementById('wmResult');
const delBtn = document.getElementById('wmDelBtn');
const delLabel = document.getElementById('wmDelLabel');
const pgInput = document.getElementById('pgInput');
const pgTotal = document.getElementById('pgTotal');
const pgFirst = document.getElementById('pgFirst');
const pgPrev = document.getElementById('pgPrev');
const pgNext = document.getElementById('pgNext');
const pgLast = document.getElementById('pgLast');

const TOTAL = 249;
let curPage = 1;
let recognized = false;   // 识别完成标记

// 打开弹框
openBtn.addEventListener('click', () => {
  overlay.classList.add('show');
  curPage = 1;
  pgInput.value = 1;
  resetModal();
  // 模拟识别过程
  wmLoading.classList.add('show');
  wmResultText.textContent = '识别中…';
  wmResult.classList.remove('ok', 'err');
  delBtn.disabled = true;
  delBtn.classList.remove('loading');
  delLabel.textContent = '删除水印';
  setTimeout(() => {
    wmLoading.classList.remove('show');
    recognized = true;
    wmResultText.textContent = '识别到 8 处水印（批注 3 + 内容流 5）';
    delBtn.disabled = false;
  }, 1400);
});

// 关闭弹框
function closeModal(){
  overlay.classList.remove('show');
  recognized = false;
  resetModal();
}
closeBtn.addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && overlay.classList.contains('show')) closeModal(); });

function resetModal(){
  // 恢复默认态
  preMark.style.display = '';
  preBox.style.display = '';
  previewWm.checked = true;
  wmResult.classList.remove('ok','err');
  wmResultText.textContent = '识别中…';
  delBtn.disabled = true;
  delBtn.classList.remove('loading');
  delLabel.textContent = '删除水印';
}

// 预览水印效果切换
previewWm.addEventListener('change', () => {
  if(!recognized) return;
  preMark.style.display = previewWm.checked ? '' : 'none';
  preBox.style.display = previewWm.checked ? '' : 'none';
});

// 翻页
function setPage(p){
  curPage = Math.max(1, Math.min(TOTAL, p));
  pgInput.value = curPage;
  if(recognized) wmResultText.textContent = `识别到 8 处水印（批注 3 + 内容流 5）· 第 ${curPage} 页`;
}
pgFirst.onclick = () => setPage(1);
pgPrev.onclick  = () => setPage(curPage - 1);
pgNext.onclick  = () => setPage(curPage + 1);
pgLast.onclick  = () => setPage(TOTAL);
pgInput.addEventListener('keydown', e => { if(e.key === 'Enter') setPage(parseInt(pgInput.value) || 1); });

// 删除水印
delBtn.addEventListener('click', () => {
  if(!recognized || delBtn.classList.contains('loading')) return;
  delBtn.classList.add('loading');
  delBtn.disabled = true;
  delLabel.textContent = '正在删除水印…';
  setTimeout(() => {
    delBtn.classList.remove('loading');
    delLabel.textContent = '删除水印';
    wmResult.classList.add('ok');
    wmResultText.textContent = '✅ 已删除 8 处水印，文件已下载：三联生活周刊_无水印.pdf';
    // 模拟已删除效果
    preMark.style.display = 'none';
    preBox.style.display = 'none';
    previewWm.checked = false;
    setTimeout(() => {
      closeModal();
    }, 1800);
  }, 1500);
});
</script>
</body>
</html>
